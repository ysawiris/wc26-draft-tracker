name: Update live scores

on:
  schedule:
    # Every 10 minutes. GitHub cron is UTC and best-effort (may lag a few min under load).
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # lets you trigger a refresh by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/fetch-scores.mjs"
      - ".github/workflows/update-scores.yml"

# Allow the job to commit the refreshed data back to the repo.
permissions:
  contents: write

# Don't pile up overlapping runs.
concurrency:
  group: update-scores
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest scores
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/fetch-scores.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data/live.json)" ]]; then
            git config user.name "wc26-bot"
            git config user.email "actions@github.com"
            git add data/live.json
            git commit -m "chore: live score update [skip ci]"
            git push
            echo "Pushed updated scores."
          else
            echo "No changes to commit."
          fi
