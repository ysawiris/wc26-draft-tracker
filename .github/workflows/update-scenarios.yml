name: Update road-to-No.1 scenarios

on:
  schedule:
    # Every 30 minutes — picks up new goals (data/live.json) and fresh
    # betting lines (data/odds.json) committed by the other crons. The
    # script only rewrites a team's scenarios when its inputs changed, so
    # most runs are a no-op and never re-call the model.
    - cron: "27 * * * *"
  workflow_dispatch: {}   # trigger a refresh by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/generate-scenarios.mjs"
      - ".github/workflows/update-scenarios.yml"

# contents: write  — commit the refreshed data back to the repo.
# models: read     — call the free GitHub Models inference API with the
#                    built-in GITHUB_TOKEN (no extra secret needed).
permissions:
  contents: write
  models: read

# Don't pile up overlapping runs.
concurrency:
  group: update-scenarios
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Provider chain (first that answers wins, then the built-in writer):
      #   1. NVIDIA NIM     — add a repo secret NVIDIA_API_KEY (nvapi-…).
      #   2. GitHub Models  — the built-in token, free, via models: read.
      # Any/all can be absent; scenarios are still produced by the built-in
      # writer (the scorelines and totals are computed either way).
      - name: Generate scenarios
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-scenarios.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data/scenarios.json)" ]]; then
            git config user.name "wc26-bot"
            git config user.email "actions@github.com"
            git add data/scenarios.json
            git commit -m "chore: road-to-No.1 scenarios update [skip ci]"
            # The scores/odds bots may have pushed while this job ran — rebase first.
            git pull --rebase origin main
            git push
            echo "Pushed updated scenarios."
          else
            echo "No changes to commit."
          fi
